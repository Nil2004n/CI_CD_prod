[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/repositories",
    "crates/scanning",
    "crates/retrieval",
    "crates/persistence",
    "crates/terminal-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154" }
